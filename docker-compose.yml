version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml_copilot_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      # Connect to host's Ollama engine seamlessly on Windows / macOS / Linux
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DEFAULT_LLM_MODEL=qwen3:4b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount data volume so index updates or cached files persist without rebuilding
      - ./data:/app/data
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
